version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./back/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password123
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ./back/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: nestjs_api
    ports:
      - "3000:3000"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/nestjs_db?schema=public
      KEYCLOAK_AUTH_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: shaderlab
      KEYCLOAK_CLIENT_ID: shaderlab_client
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: react_front
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: